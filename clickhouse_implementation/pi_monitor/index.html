<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raspberry Pi 5 Monitor</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #656d76; --track: #e6e8eb;
    --ok: #2da44e; --warn: #d4a72c; --hot: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e; --track: #30363d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 24px 4px; }
  h1 { margin: 0; font-size: 1.4rem; }
  .sub { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; padding: 16px 24px; }
  .card { background: var(--card); border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .label { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  .value { font-size: 2.4rem; font-weight: 600; margin: 6px 0 10px; font-variant-numeric: tabular-nums; }
  .value small { font-size: 1rem; color: var(--muted); font-weight: 400; }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 4px; transition: width .4s, background .4s; }
  .detail { color: var(--muted); font-size: .85rem; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .cores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .core { font-size: .75rem; color: var(--muted); }
  .core .bar { height: 6px; margin-top: 3px; }
  canvas { width: 100%; height: 60px; margin-top: 10px; display: block; }
  .err { color: var(--hot); padding: 0 24px; }
  .wide { grid-column: 1 / -1; }
  .procs { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .procs td { padding: 6px 0; font-size: .9rem; vertical-align: middle; }
  .procs .name { width: 28%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; padding-right: 12px; }
  .procs .n { color: var(--muted); font-size: .8rem; }
  .procs .mb { width: 90px; text-align: right; padding-left: 12px; }
  .procs .pct { width: 60px; text-align: right; color: var(--muted); font-size: .85rem; }
  .procs .bar > div { background: #0969da; }
</style>
</head>
<body>
<header>
  <h1>Raspberry Pi 5 Monitor</h1>
  <div class="sub" id="meta">Connecting…</div>
</header>
<div class="err" id="err"></div>

<div class="grid">
  <div class="card">
    <div class="label">CPU Usage</div>
    <div class="value" id="cpu">–</div>
    <div class="bar"><div id="cpuBar"></div></div>
    <div class="cores" id="cores"></div>
    <canvas id="cpuChart"></canvas>
    <div class="detail" id="cpuDetail"></div>
  </div>

  <div class="card">
    <div class="label">Temperature</div>
    <div class="value" id="temp">–</div>
    <div class="bar"><div id="tempBar"></div></div>
    <canvas id="tempChart"></canvas>
    <div class="detail">Pi 5 throttles at ~85 °C</div>
  </div>

  <div class="card">
    <div class="label">Memory</div>
    <div class="value" id="mem">–</div>
    <div class="bar"><div id="memBar"></div></div>
    <canvas id="memChart"></canvas>
    <div class="detail" id="memDetail"></div>
  </div>

  <div class="card wide">
    <div class="label">Top Apps by Memory</div>
    <table class="procs"><tbody id="procs"></tbody></table>
    <div class="detail">Resident memory per app (related processes grouped). Shared libraries are counted in each process, so totals overlap.</div>
  </div>
</div>

<script>
const HISTORY = 60; // points (~2 minutes at 2s refresh)
const hist = { cpu: [], temp: [], mem: [] };
const $ = id => document.getElementById(id);

function color(pct, warn, hot) {
  const s = getComputedStyle(document.documentElement);
  return s.getPropertyValue(pct >= hot ? '--hot' : pct >= warn ? '--warn' : '--ok').trim();
}

function setBar(el, pct, c) { el.style.width = Math.min(100, pct) + '%'; el.style.background = c; }

function push(arr, v) { arr.push(v); if (arr.length > HISTORY) arr.shift(); }

function spark(canvas, data, max, c) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (data.length < 2) return;
  const step = w / (HISTORY - 1);
  const x0 = w - (data.length - 1) * step;
  const y = v => h - (Math.min(v, max) / max) * (h - 2) - 1;
  ctx.beginPath();
  data.forEach((v, i) => i ? ctx.lineTo(x0 + i * step, y(v)) : ctx.moveTo(x0, y(v)));
  ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.lineTo(w, h); ctx.lineTo(x0, h); ctx.closePath();
  ctx.globalAlpha = 0.12; ctx.fillStyle = c; ctx.fill();
}

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + 'd ' : '') + h + 'h ' + m + 'm';
}

async function refresh() {
  try {
    const r = await fetch('/api/stats');
    const s = await r.json();
    $('err').textContent = '';

    // CPU
    const cc = color(s.cpu_percent, 60, 85);
    $('cpu').innerHTML = s.cpu_percent.toFixed(1) + '<small> %</small>';
    setBar($('cpuBar'), s.cpu_percent, cc);
    $('cores').innerHTML = s.cpu_cores.map((v, i) =>
      `<div class="core">Core ${i} · ${v.toFixed(0)}%<div class="bar"><div style="width:${v}%;background:${color(v, 60, 85)}"></div></div></div>`
    ).join('');
    $('cpuDetail').textContent =
      (s.cpu_freq_mhz ? s.cpu_freq_mhz + ' MHz · ' : '') + 'Load ' + s.load_avg.map(v => v.toFixed(2)).join(' / ');
    push(hist.cpu, s.cpu_percent);
    spark($('cpuChart'), hist.cpu, 100, cc);

    // Temp
    if (s.temp_c !== null) {
      const tc = color(s.temp_c, 65, 80);
      $('temp').innerHTML = s.temp_c.toFixed(1) + '<small> °C</small>';
      setBar($('tempBar'), s.temp_c, tc); // bar scale 0–100 °C
      push(hist.temp, s.temp_c);
      spark($('tempChart'), hist.temp, 100, tc);
    }

    // Memory
    const m = s.memory, mc = color(m.percent, 70, 90);
    $('mem').innerHTML = m.percent.toFixed(1) + '<small> %</small>';
    setBar($('memBar'), m.percent, mc);
    $('memDetail').textContent = `${m.used_mb} MB used of ${m.total_mb} MB · ${m.available_mb} MB available`;
    push(hist.mem, m.percent);
    spark($('memChart'), hist.mem, 100, mc);

    // Top apps
    const esc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const maxMb = Math.max(1, ...s.top_processes.map(p => p.rss_mb));
    $('procs').innerHTML = s.top_processes.map(p => `
      <tr>
        <td class="name" title="${esc(p.name)}">${esc(p.name)}${p.count > 1 ? ` <span class="n">×${p.count}</span>` : ''}</td>
        <td><div class="bar"><div style="width:${100 * p.rss_mb / maxMb}%"></div></div></td>
        <td class="mb">${p.rss_mb} MB</td>
        <td class="pct">${(100 * p.rss_mb / m.total_mb).toFixed(1)}%</td>
      </tr>`).join('');

    $('meta').textContent = 'Uptime ' + fmtUptime(s.uptime_s) + ' · updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('err').textContent = 'Cannot reach backend: ' + e.message;
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
